<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>NAWL · نَوْل</title>
  <!-- NAWL (نَوْل, the loom that weaves Al Sadu). The letter ن as a woven chevron (the bowl) with its dot as an ochre diamond,
       on a maroon square edged by two ochre weft lines, as in Al Sadu weaving. -->
  <rect width="64" height="64" fill="#8E1B2C"/>
  <path d="M0 7.5H64M0 56.5H64" stroke="#D9A441" stroke-width="2.2"/>
  <path d="M14 25L32 45.5L50 25" fill="none" stroke="#F3ECE4" stroke-width="8.5" stroke-linejoin="miter" stroke-miterlimit="10"/>
  <path d="M32 12.5L38 18.5L32 24.5L26 18.5Z" fill="#D9A441"/>
</svg>
