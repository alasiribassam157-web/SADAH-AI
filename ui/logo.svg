  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0C0C0E" stroke="#2E2C29" stroke-width="2"/>
  <g fill="#F3EEE6" opacity=".35"><circle cx="20" cy="20" r="3"/><circle cx="32" cy="20" r="3"/><circle cx="44" cy="32" r="3"/><circle cx="20" cy="44" r="3"/><circle cx="32" cy="44" r="3"/></g>
  <g fill="url(#g)"><circle cx="44" cy="20" r="4"/><circle cx="20" cy="32" r="4"/><circle cx="32" cy="32" r="4.5"/><circle cx="44" cy="44" r="4"/></g>
</svg>
