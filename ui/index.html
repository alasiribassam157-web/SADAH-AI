<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="google" content="notranslate" />
  <meta name="theme-color" content="#050506" />
  <title>sadah · ابنِ موقعك أو تطبيقك أو لعبتك بالعربي</title>
  <meta name="description" content="sadah يبني مواقع وتطبيقات وألعاب من جملة عربية: تكتب طلبك فتستلم مشروعًا جاهزًا." />
  <link rel="icon" href="/ui/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@200;300;400;500;600;700&family=Syne:wght@800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/ui/style.css" />
  <link rel="stylesheet" href="/ui/hero.css" />
  <link rel="stylesheet" href="/ui/app.css" />
  <link rel="stylesheet" href="/ui/intro.css" />
</head>
<body>
  <div id="intro" class="intro-screen" aria-hidden="true"><p class="intro-word">sadah</p></div>
  <header class="topbar">
    <a class="brand" href="/" aria-label="sadah"><img src="/ui/logo.svg" alt="" /><b>sadah</b></a>
    <span class="tag">مواقع · تطبيقات · ألعاب، من جملة عربية</span>
  </header>
  <main class="wrap">
    <div class="hero" id="hero"><canvas id="stage" aria-hidden="true"></canvas></div>
    <p id="caption" class="caption" aria-live="off"></p>
    <div class="hero-copy">
      <h1 class="hero-title">من جملة عربية <em>إلى موقع أو تطبيق أو لعبة</em></h1>
      <p class="hero-sub">صِف اللي تبيه بكلامك، وsadah يبنيه ويعطيك المعاينة والملفات جاهزة.</p>
    </div>
    <section class="narrow" aria-label="ابنِ مشروعك">
      <div class="box">
        <label for="req">وش تبي تبني؟</label>
        <textarea id="req" rows="3" maxlength="1000"></textarea>
        <div class="actions">
          <button id="go" type="button" class="btn">ابنِ</button>
          <button id="zip" type="button" class="btn ghost" disabled>تنزيل المشروع (zip)</button>
        </div>
      </div>
      <p id="msg" role="status"></p>
      <div class="kinds">
        <h2>مواقع وتطبيقات، اضغط لتجرّب مثالًا</h2><div id="kinds" class="chips"></div>
        <h2>ألعاب</h2><div id="games" class="chips"></div>
      </div>
    </section>
    <section id="result" class="result" hidden>
      <div id="editbox">
        <input id="ins" type="text" maxlength="300" aria-label="تعديل" placeholder="عدّل المشروع: غيّر اللون إلى أخضر، أضف قسم الأسعار، غيّر اللعبة إلى ثعبان…" />
        <button id="edit" type="button" class="btn">عدّل</button>
      </div>
      <iframe id="view" title="معاينة المشروع" sandbox="allow-scripts"></iframe>
    </section>
  </main>
  <footer class="foot">sadah يعمل بقواعد عربية مكتوبة من الصفر، بدون أي نموذج ذكاء خارجي، ولا يرسل طلبك لأي جهة.</footer>
  <script src="/ui/intro.js"></script>
  <script src="/ui/hero.js"></script>
  <script src="/ui/app.js"></script>
</body>
</html>
